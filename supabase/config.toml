project_id = "soliventa-learn-api"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://portal.school-a.localhost:5173"
additional_redirect_urls = [
  "http://portal.school-a.localhost:5173/**",
  "http://portal.school-b.localhost:5173/**",
]
jwt_expiry = 3600
enable_signup = false

[storage]
enabled = true
file_size_limit = "20MiB"
